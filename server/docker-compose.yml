services:
  gateway:
    build: .
    image: sdo-gateway
    restart: unless-stopped
    ports:
      - "31000:31000"   # game gateway (mod default: game.ristl.org:31000)
      - "31001:31001"   # HTTP: tickets, health, and directory-worker's /v1/join proxy
    environment:
      SDB_GATEWAY_PORT: "31000"
      SDB_HTTP_PORT: "31001"
      # Real values live only in this host's untracked .env (see
      # .env.example) — never commit actual secrets here.
      SDB_HOST_SECRET: "${SDB_HOST_SECRET}"
      SDB_TICKET_SECRET: "${SDB_TICKET_SECRET}"
      SDB_WORLD_ID: "${SDB_WORLD_ID}"
      SDB_MAX_PLAYERS: "32"
      SDB_TICKET_REPLAY_PROTECTION: "false"

      SDB_DIRECTORY_URL: "https://sdo.ristl.org"
      SDB_DIRECTORY_KEY: "${SDB_DIRECTORY_KEY}"
      SDB_SERVER_NAME: "RiStL Official Server"
      SDB_PUBLIC_HOST: "game.ristl.org"
      SDB_DB_PATH: "/app/data/players.db"

    volumes:
      - sdo-data:/app/data

volumes:
  sdo-data:
