services:
  gateway:
    build: .
    image: sdo-gateway
    restart: unless-stopped
    ports:
      - "31000:31000"   # game gateway (the mod's default port)
      - "31001:31001"   # HTTP: tickets, health, and directory-worker's /v1/join proxy
    environment:
      SDO_GATEWAY_PORT: "31000"
      SDO_HTTP_PORT: "31001"
      # Real values live only in this host's untracked .env (see
      # .env.example) — never commit actual secrets here.
      SDO_HOST_SECRET: "${SDO_HOST_SECRET}"
      SDO_TICKET_SECRET: "${SDO_TICKET_SECRET}"
      SDO_WORLD_ID: "${SDO_WORLD_ID}"
      SDO_MAX_PLAYERS: "32"
      SDO_TICKET_REPLAY_PROTECTION: "false"

      SDO_DIRECTORY_URL: "${SDO_DIRECTORY_URL}"
      SDO_DIRECTORY_KEY: "${SDO_DIRECTORY_KEY}"
      SDO_SERVER_NAME: "${SDO_SERVER_NAME:-SurrounDead Server}"
      SDO_PUBLIC_HOST: "${SDO_PUBLIC_HOST}"
      SDO_DB_PATH: "/app/data/players.db"

    volumes:
      - sdo-data:/app/data

    # node:22-slim ships neither curl nor wget, so the probe runs under node
    # itself. It checks hostOnline as well as the status code on purpose: the
    # host-agent connects to the gateway over a local socket, and if it drops
    # the process keeps serving HTTP perfectly well while the world is no
    # longer simulated. A status-code-only probe reports that as healthy.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://127.0.0.1:31001/v1/health', r => {
            let b = '';
            r.on('data', c => b += c);
            r.on('end', () => {
              try {
                process.exit(r.statusCode === 200 && JSON.parse(b).hostOnline ? 0 : 1);
              } catch { process.exit(1); }
            });
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  sdo-data:
